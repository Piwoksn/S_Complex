{% extends 'superadminwrapper.html' %}
{% load static %}

{% block content %}
<div class="container">

    <div class="row my-5 g-0">
        {% include 'messages.html' %}
      
            <div class="card shadow border-secondary">
                <div class="card-header text-center">
                    <h2>Messages</h2>
                </div>
                <div class="card-body">

                   
                    {% for chat in chats %}
                    <div class="col-sm-12 mt-3">
                        <a href="{% url 'adminchats' email=chat.receiver %}">
                        <label for="plan" class="form-label">{{chat.receiver}}</label>
                        
                    </a> 
                    <a href="{% url 'adminchatdelete' email=chat.receiver %}" class="ms-5" style="font-size: 20px;">
                    <i class="bi bi-trash-fill text-danger"></i>
                </a>
                    </div>
                    {% endfor %} 


                </div>
            </div>
       



    </div>
</div>
{% endblock content %}
