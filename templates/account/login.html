{% extends 'reg_log.html' %} {% load static %} {% block content %}
{% load crispy_forms_tags %}
<!--Logo-->
<div class="container my-5">
  <!--Login Form-->
  <div class="row justify-content-center mt-2">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body px-5">
          <div class="pt-4 pb-2">
            <a href="{% url 'home' %}">
              <img
                src="{% static 'logo22.png' %}"
                class="rounded mx-auto d-block mt-2"
                style="width: 100px"
                alt="logo"
                loading="lazy"
            /></a>
            <h5 class="card-title text-center pb-0 fs-4">
              Login to Shop Complex
            </h5>
      <br>

            {% include 'messages.html' %}
          </div>
          <form method="POST">
            {% csrf_token %}
            <!--USername-->
            <div class="col-12">
              
            {{ form | crispy }}

              <button class="btn btn-primary w-100 mb-2" type="submit">
                Login
              </button>
              <a class="btn btn-outline-danger w-100" href=""
                > <i class="bi bi-google" aria-hidden="true"></i> Login with Google</a
              >
            </div>
          </form>
          <div class="text-center mt-3">
            <a href="{% url 'fgt_pwd' %}">Forgot password?</a>
          </div>
          <div class=" mt-3">
            <p>Don't have an account? <a class="" href="{% url 'registerform' %}"
                >Signup</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
