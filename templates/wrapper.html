    <!--Nav BAr-------------------->
    <script>
        // Get a reference to your navbar
        const navbar = document.querySelector('.custom-navbar');

        // Function to toggle the fixed-navbar class based on scroll position
        function toggleNavbar() {
            if (window.scrollY > 0) {
                navbar.classList.add('fixed-navbar');
            } else {
                navbar.classList.remove('fixed-navbar');
            }
        }

        // Attach an event listener to the window's scroll event
        window.addEventListener('scroll', toggleNavbar);

        // Initial call to set the navbar's initial state
        toggleNavbar();
    </script>

    <!----------End------------->


    <!--For Back to Top Link-->
    <script>
        window.addEventListener('scroll', function () {
            var backToTop = document.querySelector('.back-to-top');
            if (window.scrollY > 100) {
                backToTop.classList.remove('d-none');
                backToTop.style.opacity = '1';
            } else {
                backToTop.style.opacity = '0';
                setTimeout(function () {
                    backToTop.classList.add('d-none');
                }, 300); // Delay the hiding of the link for smoother transition
            }
        });

        document.querySelector('.back-to-top').addEventListener('click', function (e) {
            e.preventDefault();
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>


    <!-- Ajax Reload Very good for Chats -->


    <script>
        $(document).ready(function () {
            setInterval(function () {
                $.ajax({
                    url: window.location.href,
                    type: 'GET',
                    success: function (data) {
                        var newHeader = $(data).find('.custom-header').html();
                        $('.custom-header').html(newHeader);
                    }
                });
            }, 5000); // Reload every 5 second
        });
    </script>

    <!-- Reload + Tone -->

    <!-- Ajax Reload Main -->
    <script>
        // Function to play notification sound
        function playSound() {
            var audio = new Audio("{% static 'tone/notificationtone.wav' %}");
            audio.play();
        }

        // Function to check for new notifications
        function checkNotifications() {
            $.ajax({
                url: window.location.href,
                type: 'GET',
                success: function (data) {
                    var currentCartCount = $(data).find('#notificationsDropdown .badge').text();
                    currentCartCount = parseInt(currentCartCount);

                    // Compare current cart count with previous count
                    if (currentCartCount > previousCartCount) {
                        playSound(); // Play sound if there are new notifications
                    }

                    // Update previous cart count
                    previousCartCount = currentCartCount;
                }
            });
        }

        // Variable to store previous cart count
        var previousCartCount = {{ carts.count }};

        // Call checkNotifications function when the document is ready
        $(document).ready(function () {
            // Set interval to check for new notifications every 5 seconds
            setInterval(checkNotifications, 5000);
        });
    </script>



    <!--End Ajax Reload -->
