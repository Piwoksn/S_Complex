{% extends 'superadminwrapper.html' %}
{% load static }
{% block content %}
<div class="container">


    <div class="row my-5 g-0">
        <div class="col d-flex justify-content-center align-items-center" style="width: auto;">
            <div class="card" style="width: 18rem;">
                <img src="{{user.profilepic.url}}" class="card-img-top" alt="{{itemname}}">
                <div class="card-body">



                    <p class="m-3">
                        Are you sure you want to delete <b> {{user.first_name}} {{user.last_name}}</b>?
                    </p>

                </div>

                <div class="card-body">
                    <form action="" method="POST">
                        {% csrf_token %}

                        <a href="{{request.META.HTTP_REFERER}}" class="btn btn-outline-primary"> <i
                                class="bi bi-arrow-left m-1"></i>
                            Return</a>
                        <button type="submit" class="btn btn-danger m-1">Confirm <i class="bi bi-trash"></i></button>

                    </form>
                </div>
            </div>
        </div>






    </div>
</div>



{% endblock content %}
